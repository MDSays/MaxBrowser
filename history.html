<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Выход за контур SafeNet · Макс Браузер</title>
  <link rel="stylesheet" href="internal.css" />
  <style>
    body { background: var(--bg); }
    .wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .card {
      max-width: 560px; width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px 28px 22px;
    }
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .head svg { color: var(--warn); flex: 0 0 28px; }
    .card h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .lead { color: var(--fg-dim); font-size: 13.5px; margin: 0 0 18px; line-height: 1.55; }
    .url-box {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      word-break: break-all;
      margin-bottom: 18px;
      user-select: text;
    }
    .notice {
      color: var(--fg-dim);
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 22px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.3 3.7 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0z"/>
          <path d="M12 9v4"/>
          <path d="M12 17h.01"/>
        </svg>
        <h1>Запрошен выход за контур SafeNet</h1>
      </div>

      <p class="lead">Технология <b>SafeNet&nbsp;Periphery</b> определила, что запрашиваемый адрес находится за пределами доверенного цифрового контура.</p>

      <div class="url-box" id="urlbox">(адрес не указан)</div>

      <p class="notice">Подтвердите, что у вас имеются основания для перехода к ресурсу за пределами доверенной среды.</p>

      <div class="actions">
        <button class="btn btn-primary" id="btn-back">Назад</button>
        <button class="btn"             id="btn-confirm">Подтверждаю</button>
      </div>
    </div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const u = params.get('url') || '';
document.getElementById('urlbox').textContent = u || '(адрес не указан)';
if (u) document.title = 'Подтверждение: ' + u;

document.getElementById('btn-back').addEventListener('click', () => {
  if (history.length > 1) history.back();
  else if (window.maxAPI && window.maxAPI.open) window.maxAPI.open('max://start');
  else location.href = 'start.html';
});

document.getElementById('btn-confirm').addEventListener('click', () => {
  // После подтверждения пользователь всё равно получает отказ в доступе:
  // по умолчанию доступ к зарубежным ресурсам не разрешён.
  location.href = 'blocked.html?url=' + encodeURIComponent(u);
});
</script>
</body>
</html>
