<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Не удалось открыть страницу · Макс Браузер</title>
  <link rel="stylesheet" href="internal.css" />
  <style>
    body { background: var(--bg); }
    .wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .card {
      max-width: 580px; width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px 28px 22px;
    }
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .head .icon-wrap {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: rgba(255,184,77,0.12);
      border: 1px solid rgba(255,184,77,0.35);
      display: grid; place-items: center;
      color: var(--warn);
      flex: 0 0 44px;
    }
    .head .icon-wrap svg { display: block; }
    .card h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .card .sub { color: var(--fg-mute); font-size: 12px; margin-top: 2px; letter-spacing: 0.4px; text-transform: uppercase; }

    .lead { color: var(--fg-dim); font-size: 13.5px; margin: 0 0 14px; line-height: 1.55; }

    .url-box {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      word-break: break-all;
      margin-bottom: 14px;
      user-select: text;
    }

    .reasons {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      color: var(--fg-dim);
      font-size: 12.5px;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .reasons b { color: var(--fg); font-weight: 500; }
    .reasons ul { margin: 6px 0 0; padding-left: 18px; }
    .reasons li { margin: 2px 0; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.3 3.7 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0z"/>
            <path d="M12 9v4"/>
            <path d="M12 17h.01"/>
          </svg>
        </div>
        <div>
          <h1 id="title">Не удалось открыть страницу</h1>
          <div class="sub" id="codebadge">Ошибка</div>
        </div>
      </div>

      <p class="lead" id="lead">Браузер не смог получить ответ от сервера или загрузил страницу с ошибкой.</p>

      <div class="url-box" id="urlbox">(адрес не указан)</div>

      <div class="reasons">
        <b>Возможные причины:</b>
        <ul id="reasons">
          <li>Временный сбой на стороне сайта.</li>
          <li>Проблемы с сетевым соединением.</li>
          <li>Адрес введён с опечаткой.</li>
        </ul>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="reload">Повторить попытку</button>
        <button class="btn"             id="back">Вернуться назад</button>
        <button class="btn"             id="home">На главную</button>
      </div>
    </div>
  </div>

<script>
// Карта Chromium net error codes → понятный текст и список причин.
// Полный список: https://source.chromium.org/chromium/chromium/src/+/main:net/base/net_error_list.h
const NET_ERRORS = {
  '-2':   { title: 'Соединение не удалось установить', tag: 'NET::FAILED' },
  '-3':   { title: 'Запрос был отменён', tag: 'NET::ABORTED' },
  '-7':   { title: 'Время ожидания ответа истекло', tag: 'NET::TIMED_OUT',
            reasons: ['Сервер слишком долго не отвечает.', 'Нестабильное соединение или плохой сигнал.'] },
  '-21':  { title: 'Сетевая среда изменилась', tag: 'NET::NETWORK_CHANGED' },
  '-100': { title: 'Соединение закрыто', tag: 'NET::CONNECTION_CLOSED' },
  '-101': { title: 'Соединение сброшено', tag: 'NET::CONNECTION_RESET',
            reasons: ['Сервер разорвал соединение.', 'Возможна блокировка на промежуточном узле.'] },
  '-102': { title: 'В соединении отказано', tag: 'NET::CONNECTION_REFUSED',
            reasons: ['Сервер отказал в подключении на нужном порту.', 'Возможно, сервис временно остановлен.'] },
  '-105': { title: 'Сайт не найден', tag: 'NET::NAME_NOT_RESOLVED',
            reasons: ['Не удалось определить IP-адрес сайта (ошибка DNS).', 'Адрес введён с опечаткой.', 'Проблемы с DNS-сервером провайдера.'] },
  '-106': { title: 'Нет подключения к интернету', tag: 'NET::INTERNET_DISCONNECTED',
            reasons: ['Отсутствует сетевое соединение на вашем устройстве.', 'Проверьте Wi-Fi или кабель.'] },
  '-109': { title: 'Адрес недоступен', tag: 'NET::ADDRESS_UNREACHABLE' },
  '-118': { title: 'Время ожидания соединения истекло', tag: 'NET::CONNECTION_TIMED_OUT' },
  '-130': { title: 'Не удалось подключиться через прокси', tag: 'NET::PROXY_CONNECTION_FAILED' },
  '-137': { title: 'Не удалось разрешить адрес прокси', tag: 'NET::PROXY_HOST_NOT_FOUND' },
  '-200': { title: 'Сертификат сайта недействителен (имя)', tag: 'CERT::COMMON_NAME_INVALID' },
  '-201': { title: 'Срок действия сертификата истёк', tag: 'CERT::DATE_INVALID' },
  '-202': { title: 'Сертификату нельзя доверять', tag: 'CERT::AUTHORITY_INVALID' },
  '-203': { title: 'Сертификат отозван', tag: 'CERT::REVOKED' },
  '-501': { title: 'Соединение не защищено', tag: 'NET::INSECURE_RESPONSE' }
};

// Карта типичных HTTP-кодов.
const HTTP_ERRORS = {
  400: { title: 'Некорректный запрос', reasons: ['Сервер не понял ваш запрос.', 'Возможно, ссылка повреждена.'] },
  401: { title: 'Требуется авторизация', reasons: ['Для доступа к ресурсу нужно войти в аккаунт.'] },
  403: { title: 'Доступ запрещён', reasons: ['У вашей учётной записи нет прав на просмотр этой страницы.', 'Сервер ограничил доступ из вашего региона.'] },
  404: { title: 'Страница не найдена', reasons: ['Адрес введён с опечаткой.', 'Страница была удалена или перемещена.'] },
  408: { title: 'Время ожидания истекло', reasons: ['Сервер слишком долго ожидал данные.'] },
  410: { title: 'Страница больше недоступна', reasons: ['Ресурс окончательно удалён сервером.'] },
  429: { title: 'Слишком много запросов', reasons: ['Вы отправили запросов больше разрешённого. Подождите немного и повторите.'] },
  500: { title: 'Ошибка на сервере', reasons: ['На сервере произошёл внутренний сбой. Попробуйте позже.'] },
  502: { title: 'Шлюз вернул ошибку', reasons: ['Промежуточный сервер получил некорректный ответ от целевого.'] },
  503: { title: 'Сервис временно недоступен', reasons: ['Сервер перегружен или ведутся работы.'] },
  504: { title: 'Истекло время ожидания шлюза', reasons: ['Промежуточный сервер не дождался ответа от целевого.'] }
};

(function initialize() {
  const params = new URLSearchParams(location.search);
  const targetUrl = params.get('url') || '';
  const desc = params.get('desc') || '';
  const netCode = parseInt(params.get('code') || '0', 10);
  const httpCode = parseInt(params.get('http') || '0', 10);

  let info = null;
  let badge = '';

  if (httpCode >= 400) {
    info = HTTP_ERRORS[httpCode] || { title: 'Сервер вернул ошибку', reasons: [] };
    badge = 'HTTP ' + httpCode;
  } else if (netCode) {
    info = NET_ERRORS[String(netCode)] || { title: 'Не удалось загрузить страницу', tag: 'NET::ERROR ' + netCode, reasons: [] };
    badge = info.tag || ('NET::ERROR ' + netCode);
  } else {
    info = { title: 'Не удалось открыть страницу', reasons: [] };
    badge = 'Ошибка';
  }

  document.getElementById('title').textContent = info.title;
  document.getElementById('codebadge').textContent = badge + (desc ? ' · ' + desc : '');
  document.getElementById('urlbox').textContent = targetUrl || '(адрес не указан)';
  if (targetUrl) document.title = info.title + ' · ' + targetUrl;

  const reasonsList = document.getElementById('reasons');
  if (info.reasons && info.reasons.length) {
    reasonsList.innerHTML = '';
    for (const r of info.reasons) {
      const li = document.createElement('li');
      li.textContent = r;
      reasonsList.appendChild(li);
    }
  }

  document.getElementById('reload').addEventListener('click', () => {
    if (targetUrl) {
      if (window.maxAPI && window.maxAPI.open) window.maxAPI.open(targetUrl);
      else location.href = targetUrl;
    } else {
      location.reload();
    }
  });
  document.getElementById('back').addEventListener('click', () => history.back());
  document.getElementById('home').addEventListener('click', () => {
    if (window.maxAPI && window.maxAPI.open) window.maxAPI.open('max://start');
    else location.href = 'start.html';
  });
})();
</script>
</body>
</html>
